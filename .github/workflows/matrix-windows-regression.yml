name: Matrix Windows regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagnose Windows temporary paths
        shell: pwsh
        run: |
          $paths = New-Object -ComObject Scripting.FileSystemObject
          Write-Output "TEMP=$env:TEMP; TMP=$env:TMP; RUNNER_TEMP=$env:RUNNER_TEMP"
          Write-Output "TEMP_LONG=$($paths.GetFolder($env:TEMP).Path); RUNNER_TEMP_LONG=$($paths.GetFolder($env:RUNNER_TEMP).Path)"

      - name: Run Matrix Windows regression tests
        shell: pwsh
        run: |
          node --test --test-reporter=spec infra/staging/matrix-windows-proof/runtime.test.mjs infra/staging/matrix-windows-proof/artifact.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
