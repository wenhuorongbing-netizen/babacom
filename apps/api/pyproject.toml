[project]
name = "babacom-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyJWT>=2.10,<3",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "livekit-api>=1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../../tests"]
testpaths = ["../../tests/tokens", "../../tests/ratelimit"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
